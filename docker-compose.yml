version: '3.8'

services:
  # FastAPI AI Inference Microservice
  ai_service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: oncogenix_ai_service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped

  # Django Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: oncogenix_backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=production-secret-key-change-me
      - DEBUG=False
      - FASTAPI_SERVICE_URL=http://ai_service:8001
      - ALLOWED_HOSTS=*
    depends_on:
      - ai_service
    restart: unless-stopped

  # React Frontend (Vite Nginx Production Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: oncogenix_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
